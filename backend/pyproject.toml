[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-automation-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "anthropic>=0.68,<2",
  "celery[redis]>=5.5,<6",
  "cryptography>=44,<46",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "openai>=1.99,<2",
  "PyMySQL>=1.1,<2",
  "pydantic-settings>=2.10,<3",
  "python-json-logger>=3.3,<4",
  "sqlalchemy>=2.0.41,<3",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
scraping = [
  "beautifulsoup4>=4.13,<5",
  "lxml>=6,<7",
  "scrapling>=0.3,<1",
]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
